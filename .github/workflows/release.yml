name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.2.1)"
        required: true
        default: "0.2.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Invalid version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NetworkMonitor.slnx -p:Platform=x64

      - name: Publish (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/NetworkMonitor.WinUI/NetworkMonitor.WinUI.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained true `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:RepositoryUrl=https://github.com/${{ github.repository }} `
            -o publish

      - name: Publish service (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/NetworkMonitor.Service/NetworkMonitor.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.value }} `
            installer\NetworkMonitor.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* `
            -DestinationPath "NetworkMonitor-${{ steps.version.outputs.value }}-win-x64.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: NetworkMonitor v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            installer/Output/NetworkMonitor-Setup-*.exe
            NetworkMonitor-*-win-x64.zip
