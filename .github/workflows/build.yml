name: Build

on:
  push:
    branches: [main, master]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NetworkMonitor.slnx -p:Platform=x64

      - name: Build
        run: dotnet build NetworkMonitor.slnx -c Release -p:Platform=x64 --no-restore
